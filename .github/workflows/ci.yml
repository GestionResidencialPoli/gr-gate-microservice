name: CI

on:
  push:
    branches: [main, qa, develop]
  pull_request:
    branches: [main, qa, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Pruebas unitarias
        run: pnpm test

      - name: Pruebas de integracion (PostgreSQL real con Testcontainers)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen de runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: gr-gate-microservice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir imagen de migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          load: true
          tags: gr-gate-microservice:ci-migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Levantar Postgres y RabbitMQ para la prueba
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          docker run -d --name postgres-smoke \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD="$CI_DB_PASSWORD" \
            -p 5432:5432 postgres:16-alpine
          docker run -d --name rabbitmq-smoke -p 5672:5672 rabbitmq:4-alpine
          for i in $(seq 1 30); do
            docker exec postgres-smoke pg_isready -U postgres && break
            sleep 1
          done
          for i in $(seq 1 30); do
            docker exec rabbitmq-smoke rabbitmq-diagnostics -q ping && break
            sleep 2
          done

      - name: Crear la base de datos y correr migraciones
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          docker run --rm --network host \
            -e DB_HOST=localhost -e DB_PORT=5432 -e DB_USERNAME=postgres -e DB_PASSWORD="$CI_DB_PASSWORD" -e DB_NAME=gr_gate_db \
            gr-gate-microservice:ci-migrate

      - name: Arrancar el contenedor y validar /health/ready
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          CI_INTERNAL_SERVICE_TOKEN: ${{ secrets.CI_INTERNAL_SERVICE_TOKEN }}
        run: |
          docker run -d --name app-smoke \
            --network host \
            -e DB_HOST=localhost -e DB_PORT=5432 -e DB_USERNAME=postgres -e DB_PASSWORD="$CI_DB_PASSWORD" -e DB_NAME=gr_gate_db \
            -e RABBITMQ_URL=amqp://localhost:5672 \
            -e JWT_SECRET="$CI_JWT_SECRET" \
            -e INTERNAL_SERVICE_TOKEN="$CI_INTERNAL_SERVICE_TOKEN" \
            -e USER_SERVICE_URL=http://localhost:8080 \
            gr-gate-microservice:ci

          for i in $(seq 1 15); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4300/health/ready || true)
            if [ "$status" = "200" ]; then
              echo "Servicio saludable"
              exit 0
            fi
            sleep 2
          done

          echo "El servicio no llego a estar saludable a tiempo"
          docker logs app-smoke
          exit 1

      - name: Logs (si algo fallo)
        if: failure()
        run: docker logs app-smoke || true

  release:
    name: Build y desplegar
    needs: [build-and-test, docker-smoke-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: GestionResidencialPoli/gr-infra/.github/workflows/build-push.yml@main
    with:
      service-name: gr-gate-microservice
      compose-service: gate-microservice
      migrate-target: true
    secrets:
      JENKINS_WEBHOOK_URL: ${{ secrets.JENKINS_WEBHOOK_URL }}
      JENKINS_WEBHOOK_TOKEN: ${{ secrets.JENKINS_WEBHOOK_TOKEN }}
